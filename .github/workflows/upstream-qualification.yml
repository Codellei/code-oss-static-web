name: Upstream qualification trigger

# Manual recovery/expedite path. Routine releases use Thursday's Patch release scheduler.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Resolve current protected upstream revision
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          default_branch="$(gh api "repos/$GITHUB_REPOSITORY" --jq '.default_branch')"
          [[ "$default_branch" == master ]] || {
            echo 'Upstream release requires master as the protected default branch.' >&2
            exit 1
          }
          current_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$default_branch" --jq '.sha')"
          lock="$(
            gh api -H 'Accept: application/vnd.github.raw+json' \
              "repos/$GITHUB_REPOSITORY/contents/upstream.lock.json?ref=$current_sha"
          )"
          version="$(jq -er '.tag' <<< "$lock")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v${version}-web.0" >/dev/null 2>&1; then
            echo "v${version}-web.0 already exists; use Patch release or publication recovery." >&2
            exit 1
          fi
          echo "source_sha=$current_sha" >> "$GITHUB_OUTPUT"
          echo "Manual upstream qualification for $version at $current_sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Start full browser qualification
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.upstream.outputs.source_sha }}
        run: >-
          gh workflow run qualify.yml
          --repo "$GITHUB_REPOSITORY"
          --ref master
          -f browser=all
          -f release_mode=upstream
          -f expected_source_sha="$SOURCE_SHA"
