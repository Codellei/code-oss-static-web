name: Set up canonical toolchain
description: Install Node and Python versions from the repository toolchain manifest.
inputs:
  node:
    description: Install Node.
    required: false
    default: 'true'
  python:
    description: Install Python.
    required: false
    default: 'true'
outputs:
  node-version:
    description: Canonical Node version.
    value: ${{ steps.versions.outputs.node }}
  python-version:
    description: Canonical Python version.
    value: ${{ steps.versions.outputs.python }}
runs:
  using: composite
  steps:
    - name: Load canonical toolchain versions
      id: versions
      shell: bash
      run: |
        set -euo pipefail
        manifest="$GITHUB_ACTION_PATH/../../toolchain-versions.json"
        node="$(jq -er '.node' "$manifest")"
        python="$(jq -er '.python' "$manifest")"
        {
          echo "node=$node"
          echo "python=$python"
        } >> "$GITHUB_OUTPUT"

    - name: Set up Node
      if: inputs.node == 'true'
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ steps.versions.outputs.node }}

    - name: Set up Python
      if: inputs.python == 'true'
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ steps.versions.outputs.python }}
